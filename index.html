    <script>
      // Apply the saved theme (dark by default) before first paint to avoid a flash of the wrong theme.
      (function () {
        var t;
        try { t = localStorage.getItem('theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
